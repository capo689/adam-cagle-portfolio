<!DOCTYPE html><html><body><script>
const f = document.createElement('iframe');
f.src = "http://localhost:8731/FABLE/index2.html?still";
f.style.cssText = "width:390px;height:844px;border:0";
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  const de = d.documentElement;
  let out = "SW=" + Math.max(d.body.scrollWidth, de.scrollWidth) + " CW=" + de.clientWidth;
  const bad = [];
  d.querySelectorAll("*").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > 392) bad.push(el.tagName + ":" + String(el.className||"").split(" ")[0] + ":r" + Math.round(r.right));
  });
  out += " OVERFLOWERS " + (bad.slice(0,10).join(" ; ") || "none");
  const div = document.createElement("div");
  div.textContent = "MEASURED " + out;
  document.body.appendChild(div);
}, 2500);
document.body.appendChild(f);
</script></body></html>
