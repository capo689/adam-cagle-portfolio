<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Natasha</title>
<link rel="preload" href="./assets/logo-transparent.png" as="image">
<style>
  :root {
    --bg: #090a0a;
    --gold: #d49b34;
    --ember: #be321b;
    --cream: #f7d884;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    font-family: ui-serif, Georgia, serif;
    color: var(--cream);
    background:
      radial-gradient(circle at 32% 24%, rgba(255, 214, 123, .11), transparent 24vw),
      radial-gradient(circle at 58% 46%, rgba(158, 55, 30, .12), transparent 28vw),
      radial-gradient(circle at 50% 112%, rgba(230, 162, 58, .1), transparent 34vw),
      linear-gradient(135deg, #111212 0%, #090a0a 46%, #060606 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(115deg, transparent 0 36%, rgba(255, 255, 255, .035) 46%, transparent 56%),
      repeating-radial-gradient(circle at 50% 40%, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
    opacity: .42;
    mix-blend-mode: screen;
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0 52%, rgba(0,0,0,.7) 100%);
    pointer-events: none;
  }

  .scene {
    position: relative;
    width: min(76vw, 650px);
    aspect-ratio: 966 / 1124;
    animation: sceneSettle 7600ms cubic-bezier(.2,.8,.2,1) both;
  }

  .logo-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 46% 58%;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .logo-shadow {
    opacity: 0;
    filter: blur(18px) brightness(0);
    transform: translate(2.4%, 2.8%) scale(.99);
    animation: shadowArrive 6800ms ease-out forwards;
  }

  .stem-pass {
    opacity: 0;
    filter: saturate(1.25) contrast(1.1) drop-shadow(0 0 12px rgba(220, 155, 46, .58));
    clip-path: inset(100% 0 0 0);
    mask-image:
      radial-gradient(ellipse 48% 64% at 56% 69%, #000 0 63%, transparent 72%),
      linear-gradient(to bottom, transparent 0 18%, #000 32% 100%);
    mask-composite: add;
    -webkit-mask-image:
      radial-gradient(ellipse 48% 64% at 56% 69%, #000 0 63%, transparent 72%),
      linear-gradient(to bottom, transparent 0 18%, #000 32% 100%);
    -webkit-mask-composite: source-over;
    animation: stalkGrow 6200ms cubic-bezier(.2,.86,.12,1) forwards;
  }

  .leaf-pass {
    opacity: 0;
    filter: saturate(1.2) brightness(1.08) drop-shadow(0 0 10px rgba(231, 175, 67, .42));
    transform: scale(.84) rotate(-4deg);
    mask-image: radial-gradient(ellipse 38% 24% at 40% 57%, #000 0 52%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 38% 24% at 40% 57%, #000 0 52%, transparent 70%);
    animation: leavesOpen 5600ms cubic-bezier(.22,.9,.12,1) forwards;
  }

  .bloom-pass {
    opacity: 0;
    filter: saturate(1.28) brightness(1.08) drop-shadow(0 0 18px rgba(226, 77, 28, .34));
    transform: scale(.42) rotate(-8deg);
    transform-origin: 38% 34%;
    mask-image: radial-gradient(ellipse 39% 31% at 37% 35%, #000 0 61%, transparent 73%);
    -webkit-mask-image: radial-gradient(ellipse 39% 31% at 37% 35%, #000 0 61%, transparent 73%);
    animation: flowerBloom 6400ms cubic-bezier(.15,.9,.16,1) forwards;
  }

  .petal-pulse {
    opacity: 0;
    filter: saturate(1.9) brightness(1.28) contrast(1.12);
    mix-blend-mode: screen;
    transform-origin: 38% 34%;
    mask-image:
      radial-gradient(ellipse 30% 23% at 36% 33%, #000 0 54%, transparent 70%),
      radial-gradient(ellipse 18% 15% at 47% 28%, #000 0 44%, transparent 72%);
    mask-composite: add;
    -webkit-mask-image:
      radial-gradient(ellipse 30% 23% at 36% 33%, #000 0 54%, transparent 70%),
      radial-gradient(ellipse 18% 15% at 47% 28%, #000 0 44%, transparent 72%);
    -webkit-mask-composite: source-over;
    animation: petalHeat 7600ms ease-in-out forwards;
  }

  .final-logo {
    opacity: 0;
    animation: exactResolve 7600ms ease-out forwards;
  }

  .glint {
    position: absolute;
    inset: 0;
    background: linear-gradient(116deg, transparent 0 42%, rgba(255, 231, 158, .72) 47%, transparent 52%);
    transform: translateX(-120%);
    mix-blend-mode: screen;
    mask-image: url("./assets/logo-transparent.png");
    mask-size: contain;
    mask-position: center;
    mask-repeat: no-repeat;
    -webkit-mask-image: url("./assets/logo-transparent.png");
    -webkit-mask-size: contain;
    -webkit-mask-position: center;
    -webkit-mask-repeat: no-repeat;
    animation: goldGlint 7600ms cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
  }

  .replay {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(247, 216, 132, .35);
    border-radius: 50%;
    background: rgba(9, 10, 10, .62);
    color: rgba(247, 216, 132, .88);
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  .scene.replay-run .logo-shadow,
  .scene.replay-run .stem-pass,
  .scene.replay-run .leaf-pass,
  .scene.replay-run .bloom-pass,
  .scene.replay-run .petal-pulse,
  .scene.replay-run .final-logo,
  .scene.replay-run .glint {
    animation-name: none;
  }

  @keyframes sceneSettle {
    0% { transform: translateY(18px) scale(.985); }
    65%, 100% { transform: translateY(0) scale(1); }
  }

  @keyframes shadowArrive {
    0%, 18% { opacity: 0; }
    48% { opacity: .42; }
    100% { opacity: .38; }
  }

  @keyframes stalkGrow {
    0%, 8% { opacity: 0; clip-path: inset(100% 0 0 0); }
    13% { opacity: 1; }
    54% { opacity: 1; clip-path: inset(17% 0 0 0); }
    76% { opacity: .82; clip-path: inset(0 0 0 0); }
    100% { opacity: 0; clip-path: inset(0 0 0 0); }
  }

  @keyframes leavesOpen {
    0%, 29% { opacity: 0; transform: scale(.78) rotate(-5deg); }
    49% { opacity: .95; transform: scale(1.025) rotate(1.4deg); }
    66% { opacity: .86; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(1) rotate(0); }
  }

  @keyframes flowerBloom {
    0%, 38% { opacity: 0; transform: scale(.42) rotate(-8deg); }
    52% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    64% { opacity: .95; transform: scale(.99) rotate(-.6deg); }
    76% { opacity: .78; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(1) rotate(0); }
  }

  @keyframes petalHeat {
    0%, 48% { opacity: 0; transform: scale(.98); }
    56% { opacity: .42; transform: scale(1.01); }
    62% { opacity: .14; transform: scale(1); }
    68% { opacity: .52; transform: scale(1.018); }
    74% { opacity: .18; transform: scale(1); }
    82% { opacity: .36; transform: scale(1.01); }
    100% { opacity: 0; transform: scale(1); }
  }

  @keyframes exactResolve {
    0%, 69% { opacity: 0; }
    78%, 100% { opacity: 1; }
  }

  @keyframes goldGlint {
    0%, 48% { opacity: 0; transform: translateX(-120%); }
    58% { opacity: .55; }
    74% { opacity: .3; transform: translateX(118%); }
    100% { opacity: 0; transform: translateX(118%); }
  }

  @media (max-width: 720px) {
    .scene { width: min(92vw, 540px); }
    .replay { right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="Natasha logo animation">
  <img class="logo-layer logo-shadow" src="./assets/logo-transparent.png" alt="">
  <img class="logo-layer stem-pass" src="./assets/logo-transparent.png" alt="">
  <img class="logo-layer leaf-pass" src="./assets/logo-transparent.png" alt="">
  <img class="logo-layer bloom-pass" src="./assets/logo-transparent.png" alt="">
  <img class="logo-layer petal-pulse" src="./assets/logo-transparent.png" alt="">
  <img class="logo-layer final-logo" src="./assets/logo-transparent.png" alt="Natasha floral logo">
  <span class="glint" aria-hidden="true"></span>
</main>
<button class="replay" type="button" aria-label="Replay animation">↺</button>
<script>
(() => {
  const scene = document.getElementById("scene");
  const replay = document.querySelector(".replay");
  replay.addEventListener("click", () => {
    scene.classList.add("replay-run");
    scene.offsetHeight;
    scene.classList.remove("replay-run");
  });
})();
</script>
</body>
</html>
