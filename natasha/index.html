<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Natasha</title>
<link rel="preload" href="./assets/logo-transparent.png" as="image">
<style>
  :root {
    --bg: #090a0a;
    --gold: #d9a848;
    --gold-hot: #ffe29a;
    --red: #b42816;
    --amber: #f1a33e;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 39% 24%, rgba(242, 185, 82, .11), transparent 28vw),
      radial-gradient(circle at 50% 50%, rgba(113, 42, 21, .18), transparent 34vw),
      linear-gradient(135deg, #151615 0%, #090a0a 48%, #050505 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      repeating-radial-gradient(circle at 50% 44%, rgba(255,255,255,.026) 0 1px, transparent 1px 4px),
      linear-gradient(112deg, transparent 0 35%, rgba(255,255,255,.036) 46%, transparent 58%);
    opacity: .48;
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0 50%, rgba(0,0,0,.72) 100%);
    pointer-events: none;
  }

  .scene {
    position: relative;
    width: min(78vw, 690px);
    aspect-ratio: 966 / 1124;
    isolation: isolate;
  }

  .logo,
  .svg-layer,
  .effect {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .logo {
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .svg-layer {
    overflow: visible;
    z-index: 2;
  }

  .svg-layer image {
    width: 966px;
    height: 1124px;
  }

  .grow-mask path {
    fill: none;
    stroke: #fff;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    pathLength: 1;
    animation: drawPath 3.85s cubic-bezier(.16,.84,.16,1) forwards;
  }

  .grow-mask .loop-left { stroke-width: 46; animation-delay: .2s; }
  .grow-mask .loop-right { stroke-width: 52; animation-delay: .35s; }
  .grow-mask .main-stem { stroke-width: 42; animation-delay: .7s; }
  .grow-mask .inner-stem { stroke-width: 21; animation-delay: 1.05s; }
  .grow-mask .filament { stroke-width: 16; animation-delay: 1.45s; animation-duration: 2.4s; }

  .stalk-image {
    filter: saturate(1.08) contrast(1.05);
  }

  .leaf {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 0;
    clip-path: var(--clip);
    transform-origin: var(--origin);
    transform: scale(.2) rotate(var(--start-rot));
    filter: saturate(1.1);
    animation: openLeaf 2.45s cubic-bezier(.18,.9,.16,1) forwards;
    animation-delay: var(--delay);
  }

  .leaf.left {
    --clip: polygon(19% 58%, 51% 51%, 53% 61%, 24% 66%);
    --origin: 46% 62%;
    --start-rot: -17deg;
    --delay: 2.75s;
  }

  .leaf.right {
    --clip: polygon(48% 55%, 66% 49%, 72% 54%, 52% 63%);
    --origin: 49% 63%;
    --start-rot: 16deg;
    --delay: 3.05s;
  }

  .petal {
    position: absolute;
    inset: 0;
    z-index: 4;
    opacity: 0;
    clip-path: var(--clip);
    transform-origin: 39% 38%;
    transform: translate(var(--tx), var(--ty)) scale(.16) rotate(var(--rot0));
    filter: saturate(1.2) brightness(1.02);
    animation: bloomPetal 2.35s cubic-bezier(.14,.9,.18,1) forwards;
    animation-delay: var(--delay);
  }

  .petal.p1 {
    --clip: polygon(23% 39%, 33% 28%, 43% 39%, 38% 48%, 25% 47%);
    --tx: -7%;
    --ty: 3%;
    --rot0: -32deg;
    --delay: 3.55s;
  }

  .petal.p2 {
    --clip: polygon(28% 16%, 42% 16%, 46% 39%, 37% 43%, 30% 36%);
    --tx: -3%;
    --ty: -8%;
    --rot0: -18deg;
    --delay: 3.8s;
  }

  .petal.p3 {
    --clip: polygon(40% 21%, 57% 22%, 57% 42%, 43% 43%, 37% 36%);
    --tx: 6%;
    --ty: -6%;
    --rot0: 16deg;
    --delay: 4.02s;
  }

  .petal.p4 {
    --clip: polygon(43% 38%, 59% 38%, 57% 51%, 43% 48%, 38% 43%);
    --tx: 8%;
    --ty: 1%;
    --rot0: 24deg;
    --delay: 4.22s;
  }

  .petal.p5 {
    --clip: polygon(23% 46%, 42% 42%, 45% 56%, 26% 56%, 21% 51%);
    --tx: -5%;
    --ty: 6%;
    --rot0: -10deg;
    --delay: 4.42s;
  }

  .petal.p6 {
    --clip: polygon(14% 35%, 31% 35%, 35% 45%, 18% 48%, 12% 43%);
    --tx: -11%;
    --ty: 1%;
    --rot0: -38deg;
    --delay: 4.62s;
  }

  .petal-pulse {
    opacity: 0;
    z-index: 5;
    clip-path: polygon(12% 15%, 60% 15%, 62% 56%, 22% 58%, 8% 43%);
    filter: saturate(2.05) brightness(1.35) contrast(1.12);
    mix-blend-mode: screen;
    animation: petalPulse 7.8s ease-in-out forwards;
  }

  .gold-glint {
    position: absolute;
    inset: 0;
    z-index: 7;
    opacity: 0;
    background: linear-gradient(112deg, transparent 0 43%, rgba(255, 236, 163, .82) 49%, transparent 55%);
    transform: translateX(-125%);
    mix-blend-mode: screen;
    mask-image: url("./assets/logo-transparent.png");
    mask-size: contain;
    mask-position: center;
    mask-repeat: no-repeat;
    -webkit-mask-image: url("./assets/logo-transparent.png");
    -webkit-mask-size: contain;
    -webkit-mask-position: center;
    -webkit-mask-repeat: no-repeat;
    animation: glint 7.8s cubic-bezier(.42,0,.2,1) forwards;
  }

  .final-logo {
    z-index: 8;
    opacity: 0;
    animation: exactLogo 7.8s ease-out forwards;
  }

  .replay {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(247, 216, 132, .36);
    border-radius: 50%;
    background: rgba(9,10,10,.62);
    color: rgba(247,216,132,.9);
    font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  .restart,
  .restart * {
    animation: none !important;
  }

  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }

  @keyframes openLeaf {
    0% { opacity: 0; transform: scale(.16) rotate(var(--start-rot)); }
    40% { opacity: 1; }
    76% { opacity: 1; transform: scale(1.055) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes bloomPetal {
    0% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.16) rotate(var(--rot0)); }
    34% { opacity: 1; }
    76% { opacity: 1; transform: translate(0, 0) scale(1.065) rotate(2deg); }
    100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  }

  @keyframes petalPulse {
    0%, 57% { opacity: 0; }
    63% { opacity: .36; }
    67% { opacity: .1; }
    72% { opacity: .48; }
    77% { opacity: .16; }
    83% { opacity: .34; }
    91%, 100% { opacity: 0; }
  }

  @keyframes glint {
    0%, 52% { opacity: 0; transform: translateX(-125%); }
    62% { opacity: .56; }
    77% { opacity: .25; transform: translateX(118%); }
    100% { opacity: 0; transform: translateX(118%); }
  }

  @keyframes exactLogo {
    0%, 84% { opacity: 0; }
    94%, 100% { opacity: 1; }
  }

  @media (max-width: 720px) {
    .scene { width: min(93vw, 560px); }
    .replay { right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="Natasha logo animation">
  <svg class="svg-layer" viewBox="0 0 966 1124" aria-hidden="true">
    <defs>
      <mask id="stalkGrowMask" maskUnits="userSpaceOnUse">
        <g class="grow-mask">
          <path class="loop-left" d="M461 1032 C347 1088 222 1038 214 916 C207 805 303 742 407 769 C503 794 518 906 454 962 C394 1015 301 1004 256 935" />
          <path class="loop-right" d="M468 1038 C565 972 624 867 690 744 C754 625 844 512 822 392 C806 307 712 301 626 344 C515 401 479 553 484 704 C489 856 565 1028 715 1035 C823 1040 877 962 830 906" />
          <path class="main-stem" d="M472 1010 C475 879 464 747 430 618 C401 506 357 417 274 336" />
          <path class="inner-stem" d="M488 1000 C498 842 512 676 545 545 C576 424 633 354 730 337" />
          <path class="inner-stem" d="M459 1002 C463 837 443 670 395 522 C359 414 325 335 286 226" />
          <path class="filament" d="M428 522 C394 453 351 399 318 326" />
          <path class="filament" d="M435 505 C417 433 405 365 407 288" />
          <path class="filament" d="M445 502 C446 427 468 362 513 300" />
          <path class="filament" d="M456 516 C489 447 540 397 607 358" />
          <path class="filament" d="M416 514 C363 470 295 450 216 451" />
        </g>
      </mask>
    </defs>
    <image class="stalk-image" href="./assets/logo-transparent.png" mask="url(#stalkGrowMask)"></image>
  </svg>

  <img class="logo leaf left" src="./assets/logo-transparent.png" alt="">
  <img class="logo leaf right" src="./assets/logo-transparent.png" alt="">

  <img class="logo petal p1" src="./assets/logo-transparent.png" alt="">
  <img class="logo petal p2" src="./assets/logo-transparent.png" alt="">
  <img class="logo petal p3" src="./assets/logo-transparent.png" alt="">
  <img class="logo petal p4" src="./assets/logo-transparent.png" alt="">
  <img class="logo petal p5" src="./assets/logo-transparent.png" alt="">
  <img class="logo petal p6" src="./assets/logo-transparent.png" alt="">

  <img class="logo effect petal-pulse" src="./assets/logo-transparent.png" alt="">
  <span class="gold-glint" aria-hidden="true"></span>
  <img class="logo final-logo" src="./assets/logo-transparent.png" alt="Natasha floral logo">
</main>
<button class="replay" type="button" aria-label="Replay animation">R</button>
<script>
(() => {
  const scene = document.getElementById("scene");
  const replay = document.querySelector(".replay");

  replay.addEventListener("click", () => {
    scene.classList.add("restart");
    scene.offsetHeight;
    scene.classList.remove("restart");
  });
})();
</script>
</body>
</html>
