<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#000000">
  <title>FACE2 · Groq + Inflect</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .fallback {
      position: fixed; inset: 0; display: none; place-items: center;
      color: #c99b3a; background: #000; font: 11px/1.5 ui-monospace, monospace;
      letter-spacing: .22em; text-transform: uppercase;
    }
    .wake {
      position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
      border: 0; color: #d8a943; background: rgba(0, 0, 0, .20); cursor: pointer;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .32em; text-transform: uppercase;
    }
    .wake::before {
      content: ""; position: absolute; width: 54px; height: 54px; border: 1px solid rgba(216,169,67,.52);
      border-radius: 50%; box-shadow: 0 0 38px rgba(216,169,67,.16); transform: scale(var(--progress, .16));
      transition: transform .25s ease;
    }
    .wake span { margin-top: 92px; max-width: min(80vw, 520px); text-align: center; }
    .wake[hidden] { display: none; }
    .status {
      position: fixed; left: 18px; bottom: 16px; z-index: 4; color: rgba(216,169,67,.72);
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .24em;
      text-transform: uppercase; pointer-events: none; transition: opacity .45s ease;
    }
    .status:empty { opacity: 0; }
    .transcript {
      position: fixed; left: 50%; bottom: 72px; z-index: 4; width: min(640px, calc(100vw - 48px));
      transform: translateX(-50%); text-align: center; pointer-events: none;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-shadow: 0 1px 14px #000, 0 1px 14px #000;
    }
    .transcript[hidden] { display: none; }
    .transcript p { margin: 0; }
    .transcript .user { color: rgba(255,255,255,.48); }
    .transcript .agent { margin-top: 7px; color: rgba(216,169,67,.88); }
    .mic {
      position: fixed; left: 50%; bottom: 15px; z-index: 5; width: 42px; height: 42px;
      transform: translateX(-50%); border: 1px solid rgba(216,169,67,.58); border-radius: 50%;
      color: #d8a943; background: rgba(0,0,0,.45); cursor: pointer;
      box-shadow: 0 0 28px rgba(216,169,67,.12); transition: transform .2s, background .2s, box-shadow .2s;
    }
    .mic::before { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: currentColor; opacity: .8; }
    .mic span { position: absolute; width: max-content; left: 50%; top: -17px; transform: translateX(-50%); font: 8px/1 ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; }
    .mic[data-active="true"] { background: rgba(216,169,67,.18); box-shadow: 0 0 38px rgba(216,169,67,.32); animation: pulse 1.1s ease-in-out infinite; }
    .mic:disabled { opacity: .38; cursor: wait; }
    .mic[hidden] { display: none; }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.12); } }
    .replay {
      position: fixed; right: 18px; bottom: 14px; z-index: 4; border: 0; padding: 6px;
      color: rgba(216,169,67,.68); background: transparent; cursor: pointer;
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .22em;
      text-transform: uppercase;
    }
    .replay[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Animated gold particle AI face with Groq conversation and Inflect speech"></main>
  <p class="fallback" id="fallback">WebGL is required</p>
  <button class="wake" id="wake" type="button"><span>Wake the agent</span></button>
  <section class="transcript" id="transcript" aria-live="polite" hidden>
    <p class="user" id="user-line"></p>
    <p class="agent" id="agent-line"></p>
  </section>
  <output class="status" id="status" aria-live="polite"></output>
  <button class="mic" id="mic" type="button" aria-label="Start or stop talking" hidden><span>Talk</span></button>
  <button class="replay" id="replay" type="button" hidden>Speak again</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
