<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<base href="/space/">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<title>SULU INVADERS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --neon:#37c6ff; --amber:#ffb12e; --mag:#ff3df0; --green:#5dff7a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; font-family:"Press Start 2P",monospace; }

  /* the console scene; game renders inside its monitor */
  #stage{
    position:relative; background:#000;
    width:min(100vw, calc(100vh * 1448 / 1086));
    height:min(100vh, calc(100vw * 1086 / 1448));
  }
  /* fullscreen the WRAPPER (it fills the screen, black) and center the
     aspect-locked stage inside it -> letterbox, never stretch. Done on a
     wrapper because the UA gives the fullscreen element width:100% !important,
     which an author rule cannot override. */
  #fswrap{ display:flex; align-items:center; justify-content:center; background:#000; }
  #fswrap:fullscreen{ width:100%; height:100%; }
  #fswrap:-webkit-full-screen{ width:100%; height:100%; }
  :fullscreen::backdrop{ background:#000; }
  :-webkit-full-screen::backdrop{ background:#000; }
  #bg{ position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }

  /* the monitor screen rectangle (measured from the art) */
  #screen{
    position:absolute;
    left:25%; top:7.5%; width:58%; height:56%;
    background:#02040a; overflow:hidden;
  }
  #game{ width:100%; height:100%; display:block; image-rendering:pixelated; cursor:none; touch-action:none; user-select:none; }

  /* control strip lives on the console area so it's visible in fullscreen too */
  #controls{
    position:absolute; left:50%; bottom:1.5%; transform:translateX(-50%);
    display:flex; gap:.9vmin; align-items:center; justify-content:center; flex-wrap:wrap; z-index:5;
    width:78%;
  }
  #controls button, #controls input{
    font-family:"Press Start 2P",monospace; font-size:1.15vmin; letter-spacing:.05em;
  }
  #controls button{
    color:#9fe6ff; background:rgba(6,18,30,.85); border:1px solid #1d4e6e;
    border-radius:4px; padding:1vmin 1.4vmin; cursor:pointer; text-transform:uppercase;
  }
  #controls button:hover{ color:#fff; border-color:var(--neon); box-shadow:0 0 10px rgba(55,198,255,.6); }
  #controls button.active{ color:#02040a; background:var(--neon); border-color:#fff; box-shadow:0 0 12px rgba(55,198,255,.75); }
  .controlGroup{
    display:flex; align-items:center; gap:.55vmin; color:#9fe6ff;
    background:rgba(6,18,30,.78); border:1px solid #1d4e6e; border-radius:4px;
    padding:.72vmin .9vmin; text-transform:uppercase; white-space:nowrap;
  }
  .controlGroup span{ font-size:1.05vmin; color:var(--amber); }
  .controlGroup input[type="range"]{ width:9vmin; accent-color:var(--neon); cursor:pointer; }

  /* faint CRT scanlines over the screen */
  #screen::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:3; opacity:.18;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.6) 2px 3px);
  }
  #loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--neon); font-size:2vmin; z-index:4; }
</style>
</head>
<body>
  <div id="fswrap">
  <div id="stage">
    <img id="bg" src="suluoutline.png?v=2" alt="">
    <div id="screen">
      <canvas id="game" width="800" height="580"></canvas>
      <div id="loading">LOADING…</div>
    </div>
    <div id="controls">
      <button id="btn-full">Go Full Screen</button>
      <div class="controlGroup"><span>Skool:</span><button id="btn-new" class="active" data-track="new">New</button><button id="btn-old" data-track="old">Old</button></div>
      <label class="controlGroup"><span>Music</span><input id="music-vol" type="range" min="0" max="100" value="70"></label>
      <label class="controlGroup"><span>SFX</span><input id="sfx-vol" type="range" min="0" max="100" value="70"></label>
      <button id="btn-mute">Mute: Off</button>
      <button id="btn-restart">Restart</button>
    </div>
  </div>
  </div>

<script>
(function(){
"use strict";
const CW=800, CH=580;
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

/* ---------- assets ---------- */
const SPR={};
const manifest={
  ships:["ship-0-base","ship-1-bigguns","ship-2-missiles","ship-3-gunsmissiles","ship-4-nuke"],
  shieldL:"shield-l", shieldR:"shield-r",
  small:Array.from({length:10},(_,i)=>"enemy-small-"+i),
  medium:Array.from({length:6},(_,i)=>"enemy-medium-"+i),
  large:Array.from({length:4},(_,i)=>"enemy-large-"+i)
};
function load(){
  const all=[...manifest.ships, manifest.shieldL, manifest.shieldR, ...manifest.small, ...manifest.medium, ...manifest.large];
  let n=0; return Promise.all(all.map(name=>new Promise(res=>{
    const img=new Image(); img.onload=img.onerror=()=>{ SPR[name]=img; res(); }; img.src="sprites/"+name+".png?v=2";
  })));
}

/* ---------- input ---------- */
const keys={};
let mouseX=null, mouseFire=false, mouseActive=false, activePointer=null;
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key]=true; mouseActive=false;
  if(state==="enterName") handleNameKey(e);
  else if(e.key===" "||e.key==="Enter") onPrimary();
});
addEventListener("keyup",e=>{ keys[e.key]=false; });
function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*CW, y:(e.clientY-r.top)/r.height*CH };
}
function setPointerPos(e){
  const p=canvasPos(e);
  mouseX=p.x; mouseActive=true; lastMouse=p;
}
canvas.addEventListener("pointermove",e=>{
  if(activePointer!==null && e.pointerId!==activePointer) return;
  setPointerPos(e);
});
canvas.addEventListener("pointerdown",e=>{
  if(e.button!==undefined && e.button>0) return;
  e.preventDefault();
  activePointer=e.pointerId;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  setPointerPos(e);
  mouseFire=true;
  onPrimary(true);
});
function endPointer(e){
  if(activePointer!==null && e.pointerId!==activePointer) return;
  mouseFire=false;
  activePointer=null;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("lostpointercapture",()=>{ mouseFire=false; activePointer=null; });
let lastMouse={x:0,y:0};

/* ---------- audio ---------- */
let AC=null, muted=false, sfxVol=.7, musicVol=.7, skool="new";
const MUSIC={new:"concrete-chrome.mp3?v=1",old:"invader-beacon.mp3?v=1"};
const music=new Audio(MUSIC[skool]);
music.loop=true;
music.preload="auto";
music.volume=musicVol;
function updateSkoolButtons(){
  document.querySelectorAll("[data-track]").forEach(btn=>btn.classList.toggle("active",btn.dataset.track===skool));
}
function setMusicTrack(track,autoplay){
  if(!MUSIC[track]) return;
  const wasPlaying=!music.paused;
  skool=track;
  music.src=MUSIC[skool];
  music.loop=true;
  music.volume=musicVol;
  music.muted=muted||musicVol<=0;
  updateSkoolButtons();
  if(autoplay||wasPlaying) startMusic();
}
function startMusic(){
  music.volume=musicVol;
  music.muted=muted||musicVol<=0;
  if(muted||musicVol<=0) return;
  const p=music.play();
  if(p&&p.catch) p.catch(()=>{});
}
function stopMusic(){
  music.pause();
  music.currentTime=0;
}
function beep(freq,dur,type,vol){
  if(muted||sfxVol<=0) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  if(AC.state==="suspended") AC.resume();
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"square"; o.frequency.value=freq;
  g.gain.value=(vol||.06)*sfxVol; o.connect(g); g.connect(AC.destination);
  const t=AC.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.08)); o.stop(t+(dur||.08));
}
const sfx={
  shoot:()=>beep(680,.05,"square",.04),
  missile:()=>beep(320,.12,"sawtooth",.05),
  hit:()=>beep(180,.06,"square",.05),
  boom:()=>{beep(90,.25,"sawtooth",.09); beep(140,.18,"square",.05);},
  power:()=>{beep(880,.08,"square",.06); setTimeout(()=>beep(1320,.1,"square",.06),70);},
  nuke:()=>{beep(60,.5,"sawtooth",.12);},
  lose:()=>{beep(200,.3,"sawtooth",.08); setTimeout(()=>beep(120,.4,"sawtooth",.08),150);},
  level:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12,"square",.06),i*90));}
};

/* ---------- entities ---------- */
let player, enemies, pbullets, ebullets, powerups, parts, boss;
let state="loading"; // loading,menu,playing,levelclear,gameover,enterName,board,win
let score, lives, level, weapon, shield, fireTimer, levelTimer, flashTimer, shake, msg;
let formDir, formDropQ, stars, formInitial;
const MAX_WEAPON=4;

const ENEMY={
  small:{ h:26, hp:1, fireRate:.0016, bspeed:150, pattern:"straight" },
  medium:{ h:38, hp:3, fireRate:.0042, bspeed:185, pattern:"aimed" },
  large:{ h:60, hp:9, fireRate:.0075, bspeed:165, pattern:"spread" }
};

function makeStars(){
  stars=[]; for(let i=0;i<70;i++) stars.push({x:Math.random()*CW,y:Math.random()*CH,z:Math.random()*.8+.2});
}

function resetPlayer(){
  player={ x:CW/2, y:CH-34, w:42, h:30, speed:330, vx:0, inv:0 };
}
function newGame(){
  score=0; lives=3; level=1; weapon=0; shield=0; resetPlayer(); makeStars();
  startLevel();
  state="playing";
  startMusic();
}

/* ---------- level building ---------- */
function startLevel(){
  enemies=[]; pbullets=[]; ebullets=[]; powerups=[]; parts=[]; boss=null;
  fireTimer=0; formDir=1; formDropQ=0; flashTimer=0; shake=0;
  const L=LEVELS[Math.min(level-1,LEVELS.length-1)];
  buildFormation(L);
  if(L.boss) spawnBoss(L.boss);
  formInitial=Math.max(1,enemies.length);
  msg=null;
}
const LEVELS=[
  // 1
  { rows:[["small",0],["small",2],["small",4]], cols:7, sp:34, fire:1, diver:.0006 },
  // 2
  { rows:[["small",1],["small",3],["medium",0],["small",6]], cols:8, sp:40, fire:1.3, diver:.0012 },
  // 3
  { rows:[["medium",1],["small",5],["medium",2],["small",7],["small",9]], cols:8, sp:46, fire:1.6, diver:.002 },
  // 4
  { rows:[["medium",3],["medium",4],["small",8],["large",0],["small",2],["medium",5]], cols:9, sp:54, fire:2, diver:.003 },
  // 5
  { rows:[["large",1],["medium",0],["large",2],["medium",2],["small",4],["small",6]], cols:9, sp:62, fire:2.5, diver:.0042 },
  // 6 — boss
  { rows:[["small",0],["medium",1],["small",3]], cols:7, sp:50, fire:1.6, diver:.0025, boss:3 }
];

function buildFormation(L){
  const cols=L.cols, gx=58, gy=42, x0=(CW-(cols-1)*gx)/2, y0=44;
  L.rows.forEach((row,r)=>{
    const cls=row[0], spriteIdx=row[1];
    for(let c=0;c<cols;c++){
      enemies.push(makeEnemy(cls,spriteIdx,x0+c*gx,y0+r*gy,L));
    }
  });
}
function makeEnemy(cls,spriteIdx,fx,fy,L){
  const base=ENEMY[cls]; const spr=SPR[manifest[cls][spriteIdx]];
  const ar=spr?spr.width/spr.height:1; const h=base.h, w=h*ar;
  // per-enemy variety: small tweaks to speed & fire by sprite index
  const vary=1+((spriteIdx%5)-2)*0.06;
  return {
    cls, spr, fx, fy, x:fx, y:fy, w, h, hp:base.hp,
    pattern: cls==="small" ? (spriteIdx%3===0?"straight":(spriteIdx%3===1?"straight":"aimed"))
            : base.pattern,
    fireRate: base.fireRate*(L.fire||1)*vary,
    bspeed: base.bspeed*vary,
    score: cls==="small"?(10+spriteIdx*4):cls==="medium"?(60+spriteIdx*10):(180+spriteIdx*40),
    state:"form", diveT:0, diveX0:0, alive:true, hitFlash:0
  };
}
function spawnBoss(scale){
  const spr=SPR[manifest.large[2]];
  const ar=spr.width/spr.height; const h=140, w=h*ar;
  boss={ spr, x:CW/2, y:-90, w, h, hp:120, maxhp:120, t:0, dir:1, fireT:0, phase:0, entering:true, hitFlash:0 };
}

/* ---------- update ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts;
  if(state==="playing") update(dt);
  if(flashTimer>0) flashTimer-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*60);
  render();
  requestAnimationFrame(frame);
}

function update(dt){
  // stars
  for(const s of stars){ s.y+=(18+s.z*36)*dt; if(s.y>CH){ s.y=0; s.x=Math.random()*CW; } }

  // ----- player movement -----
  let dir=0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"]) dir-=1;
  if(keys["ArrowRight"]||keys["d"]||keys["D"]) dir+=1;
  if(dir!==0){ player.x+=dir*player.speed*dt; }
  else if(mouseActive && mouseX!=null){ player.x+=(mouseX-player.x)*Math.min(1,dt*12); }
  player.x=Math.max(player.w/2,Math.min(CW-player.w/2,player.x));
  if(player.inv>0) player.inv-=dt;

  // ----- player fire -----
  fireTimer-=dt;
  const wantFire = keys[" "]||mouseFire;
  if(wantFire && fireTimer<=0){ playerFire(); fireTimer=fireCooldown(); }

  // ----- player bullets -----
  for(const b of pbullets){
    b.x+=(b.vx||0)*dt; b.y+=b.vy*dt;
    if(b.homing){ // missiles seek nearest enemy
      const t=nearestEnemy(b.x,b.y);
      if(t){ const a=Math.atan2(t.y-b.y,t.x-b.x); b.vx+=Math.cos(a)*420*dt; b.vx=Math.max(-260,Math.min(260,b.vx)); }
    }
  }
  pbullets=pbullets.filter(b=>b.y>-20 && b.y<CH+20 && !b.dead);

  // ----- enemy formation march -----
  marchFormation(dt);
  // diver spawns
  const L=LEVELS[Math.min(level-1,LEVELS.length-1)];
  if(Math.random()<(L.diver||0)*60*dt){ const cand=enemies.filter(e=>e.state==="form"); if(cand.length){ const e=cand[(Math.random()*cand.length)|0]; e.state="dive"; e.diveT=0; e.diveX0=e.x; e.diveDir=player.x<e.x?-1:1; } }

  // ----- enemies update + fire -----
  for(const e of enemies){
    if(e.hitFlash>0) e.hitFlash-=dt;
    if(e.state==="dive"){
      e.diveT+=dt;
      e.y+=150*dt;
      e.x=e.diveX0 + Math.sin(e.diveT*4)*70 + e.diveDir*e.diveT*40;
      if(e.y>CH+30){ e.state="form"; e.y=e.fy; e.x=e.fx; } // loop back to formation slot
    }
    // fire
    if(Math.random()<e.fireRate*60*dt) enemyFire(e);
  }

  // ----- boss -----
  if(boss) updateBoss(dt);

  // ----- enemy bullets -----
  for(const b of ebullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  ebullets=ebullets.filter(b=>b.y<CH+20 && b.y>-20 && b.x>-20 && b.x<CW+20);

  // ----- powerups fall -----
  for(const p of powerups){ p.y+=70*dt; p.t=(p.t||0)+dt; }
  powerups=powerups.filter(p=>p.y<CH+20 && !p.dead);

  // ----- particles -----
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);

  collisions();
  checkLevelEnd(dt);
}

function fireCooldown(){ return [0.34,0.26,0.30,0.22,0.40][weapon]; }
function playerFire(){
  const x=player.x, y=player.y-16;
  const shot=(dx,vx,col,homing,big)=>pbullets.push({x:x+dx,y,vx:vx||0,vy:-520,r:big?5:3,dmg:big?3:1,col,homing,big});
  if(weapon===0){ shot(0,0,"#9fe6ff"); sfx.shoot(); }
  else if(weapon===1){ shot(-7,0,"#9fe6ff"); shot(7,0,"#9fe6ff"); sfx.shoot(); }
  else if(weapon===2){ shot(0,0,"#9fe6ff"); pbullets.push({x:x-14,y,vx:0,vy:-440,r:4,dmg:2,col:"#ff5a3c",homing:true}); pbullets.push({x:x+14,y,vx:0,vy:-440,r:4,dmg:2,col:"#ff5a3c",homing:true}); sfx.missile(); }
  else if(weapon===3){ shot(-9,0,"#9fe6ff"); shot(9,0,"#9fe6ff"); pbullets.push({x:x-16,y,vx:0,vy:-460,r:4,dmg:2,col:"#ff5a3c",homing:true}); pbullets.push({x:x+16,y,vx:0,vy:-460,r:4,dmg:2,col:"#ff5a3c",homing:true}); sfx.missile(); }
  else if(weapon===4){ shot(-10,0,"#9fe6ff"); shot(10,0,"#9fe6ff"); pbullets.push({x,y,vx:0,vy:-360,r:9,dmg:8,col:"#ffe24a",homing:false,big:true,nuke:true}); sfx.nuke(); }
}
function nearestEnemy(x,y){
  let best=null,bd=1e9; const list=boss?[...enemies,boss]:enemies;
  for(const e of list){ const d=(e.x-x)**2+(e.y-y)**2; if(d<bd){bd=d;best=e;} } return best;
}

function marchFormation(dt){
  const form=enemies.filter(e=>e.state==="form");
  if(!form.length) return;
  const alive=enemies.length;
  const L=LEVELS[Math.min(level-1,LEVELS.length-1)];
  const speed=L.sp*(1+ (1-alive/formInitial)*1.4 );
  let hitEdge=false;
  for(const e of form){ e.fx+=formDir*speed*dt; if(e.fx<e.w/2+6||e.fx>CW-e.w/2-6) hitEdge=true; }
  if(hitEdge){ formDir*=-1; for(const e of enemies){ e.fy+=16; } }
  for(const e of form){ e.x=e.fx; e.y=e.fy; }
  // lose if formation reaches player line
  for(const e of form){ if(e.fy>player.y-26){ playerHit(true); break; } }
}

function enemyFire(e){
  const sp=e.bspeed;
  if(e.pattern==="straight"){ ebullets.push({x:e.x,y:e.y+e.h/2,vx:0,vy:sp,r:3,col:"#ff5a7a"}); }
  else if(e.pattern==="aimed"){ const a=Math.atan2(player.y-e.y,player.x-e.x); ebullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3,col:"#ffb12e"}); }
  else if(e.pattern==="spread"){ for(const d of [-0.4,0,0.4]){ const a=Math.PI/2+d; ebullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3,col:"#ff3df0"}); } }
}

function updateBoss(dt){
  const b=boss; b.t+=dt;
  if(b.entering){ b.y+=60*dt; if(b.y>=80){ b.entering=false; } return; }
  if(b.hitFlash>0) b.hitFlash-=dt;
  b.x+=b.dir*70*dt; if(b.x<b.w/2+10||b.x>CW-b.w/2-10) b.dir*=-1;
  b.fireT-=dt;
  if(b.fireT<=0){
    b.phase=(b.phase+1)%3;
    if(b.phase===0){ for(let i=0;i<7;i++){ const a=Math.PI/2 + (i-3)*0.22; ebullets.push({x:b.x,y:b.y+b.h/2,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:4,col:"#ff3df0"}); } b.fireT=1.0; }
    else if(b.phase===1){ const a=Math.atan2(player.y-b.y,player.x-b.x); for(let i=-1;i<=1;i++){ ebullets.push({x:b.x,y:b.y+b.h/2,vx:Math.cos(a+i*.12)*240,vy:Math.sin(a+i*.12)*240,r:4,col:"#ffb12e"}); } b.fireT=.5; }
    else { // spawn 2 minions
      for(const s of [-1,1]){ const e=makeEnemy("small",(Math.random()*10)|0,b.x+s*60,b.y+40,LEVELS[5]); e.state="dive"; e.diveT=0; e.diveX0=e.x; e.diveDir=s; enemies.push(e); } b.fireT=1.4;
    }
  }
}

/* ---------- collisions ---------- */
function hitEnemy(e,dmg,bx,by){
  e.hp-=dmg; e.hitFlash=.08; sfx.hit();
  if(e.hp<=0){ e.alive=false; score+=e.score; explode(e.x,e.y,e.cls); maybeDrop(e.x,e.y); }
}
function collisions(){
  // player bullets vs enemies + boss
  for(const b of pbullets){
    if(b.dead) continue;
    for(const e of enemies){
      if(!e.alive) continue;
      if(Math.abs(b.x-e.x)<e.w*0.46 && Math.abs(b.y-e.y)<e.h*0.5){
        hitEnemy(e,b.dmg,b.x,b.y);
        if(b.nuke){ nukeBurst(b.x,b.y); }
        if(!b.big) b.dead=true; else b.dmg=Math.max(0,b.dmg-1), b.dmg<=0&&(b.dead=true);
        break;
      }
    }
    if(boss && !b.dead){
      if(Math.abs(b.x-boss.x)<boss.w*0.4 && Math.abs(b.y-boss.y)<boss.h*0.42){
        boss.hp-=b.dmg; boss.hitFlash=.08; sfx.hit(); if(!b.big)b.dead=true; else {b.dmg-=2; if(b.dmg<=0)b.dead=true;}
        if(boss.hp<=0){ bossDie(); }
      }
    }
  }
  enemies=enemies.filter(e=>e.alive);
  pbullets=pbullets.filter(b=>!b.dead);

  // enemy bullets vs player
  if(player.inv<=0){
    for(const b of ebullets){
      if(Math.abs(b.x-player.x)<player.w*0.4 && Math.abs(b.y-player.y)<player.h*0.5){ b.dead=true; playerHit(); break; }
    }
    ebullets=ebullets.filter(b=>!b.dead);
    // enemy body vs player (divers)
    for(const e of enemies){ if(e.state==="dive" && Math.abs(e.x-player.x)<(e.w+player.w)*0.4 && Math.abs(e.y-player.y)<(e.h+player.h)*0.4){ explode(e.x,e.y,e.cls); e.alive=false; playerHit(); break; } }
    enemies=enemies.filter(e=>e.alive);
  }

  // powerups vs player
  for(const p of powerups){
    if(Math.abs(p.x-player.x)<28 && Math.abs(p.y-player.y)<24){ p.dead=true; applyPower(p.kind); }
  }
  powerups=powerups.filter(p=>!p.dead);
}

function playerHit(forceLose){
  if(shield>0 && !forceLose){ shield--; player.inv=1; sfx.hit(); explode(player.x,player.y-10,"small"); shake=8; return; }
  lives--; player.inv=1.6; shake=14; sfx.lose(); explode(player.x,player.y,"large");
  weapon=Math.max(0,weapon-1);
  if(lives<=0){ gameOver(); }
}

/* ---------- powerups ---------- */
function maybeDrop(x,y){
  if(Math.random()<0.13){
    const r=Math.random();
    let kind = r<0.5?"weapon" : r<0.78?"shield" : r<0.92?"score" : "life";
    powerups.push({x,y,kind,t:0});
  }
}
function applyPower(kind){
  sfx.power();
  if(kind==="weapon"){ weapon=Math.min(MAX_WEAPON,weapon+1); }
  else if(kind==="shield"){ shield=Math.min(3,shield+2); }
  else if(kind==="score"){ score+=250; }
  else if(kind==="life"){ lives=Math.min(5,lives+1); }
  flashTimer=.2;
}

/* ---------- fx ---------- */
function explode(x,y,cls){
  sfx.boom(); const n=cls==="large"?34:cls==="medium"?20:12; const cols=["#fff","#ffd24a","#ff7a3c","#37c6ff"];
  for(let i=0;i<n;i++){ const a=Math.random()*7, s=40+Math.random()*180; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.4+Math.random()*.5,col:cols[(Math.random()*cols.length)|0],r:1+Math.random()*2.5}); }
  shake=Math.max(shake,cls==="large"?12:cls==="medium"?7:4);
}
function nukeBurst(x,y){
  flashTimer=.35; shake=18; sfx.nuke();
  for(const e of enemies){ if((e.x-x)**2+(e.y-y)**2 < 160**2){ e.hp-=4; e.hitFlash=.1; if(e.hp<=0){e.alive=false;score+=e.score;explode(e.x,e.y,e.cls);} } }
  if(boss && (boss.x-x)**2+(boss.y-y)**2<200**2){ boss.hp-=20; }
  enemies=enemies.filter(e=>e.alive);
}
function bossDie(){
  for(let i=0;i<6;i++) setTimeout(()=>explode(boss.x+(Math.random()-.5)*boss.w, boss.y+(Math.random()-.5)*boss.h,"large"),i*90);
  score+=3000; boss=null; flashTimer=.4;
}

/* ---------- level flow ---------- */
function checkLevelEnd(dt){
  if(enemies.length===0 && !boss){
    if(level>=LEVELS.length){ win(); }
    else { state="levelclear"; levelTimer=2.2; sfx.level(); }
  }
}
function checkAdvance(dt){
  if(state==="levelclear"){ levelTimer-=dt; if(levelTimer<=0){ level++; startLevel(); state="playing"; } }
}

/* ---------- states ---------- */
function onPrimary(fromMouse){
  if(state==="menu"){ ensureInitial(); newGame(); }
  else if(state==="board"){ state="menu"; }
  else if(state==="gameover"){ state="enterName"; nameBuf=""; }
  else if(state==="win"){ state="enterName"; nameBuf=""; }
}
function gameOver(){ state="gameover"; }
function win(){ state="win"; }

/* ---------- leaderboard ---------- */
const LBKEY="suluInvadersBoard";
function getBoard(){ try{ return JSON.parse(localStorage.getItem(LBKEY))||[]; }catch(e){ return []; } }
function saveScore(name){
  const b=getBoard(); b.push({name:name||"YOU",score,level,d:Date.now()});
  b.sort((a,b)=>b.score-a.score); const top=b.slice(0,10);
  try{ localStorage.setItem(LBKEY,JSON.stringify(top)); }catch(e){}
  state="board";
}
let nameBuf="";
function handleNameKey(e){
  if(e.key==="Enter"){ saveScore(nameBuf.trim()||"YOU"); return; }
  if(e.key==="Backspace"){ nameBuf=nameBuf.slice(0,-1); return; }
  if(/^[a-zA-Z0-9 ]$/.test(e.key) && nameBuf.length<10){ nameBuf+=e.key.toUpperCase(); }
}
function ensureInitial(){}

/* ---------- render ---------- */
function render(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); }
  ctx.fillStyle="#02040a"; ctx.fillRect(-20,-20,CW+40,CH+40);
  // stars
  for(const s of stars){ ctx.globalAlpha=s.z; ctx.fillStyle="#7fd4ff"; ctx.fillRect(s.x|0,s.y|0,s.z>0.7?2:1,s.z>0.7?2:1); }
  ctx.globalAlpha=1;

  if(state==="loading"){ ctx.restore(); return; }
  if(state==="menu"){ drawMenu(); ctx.restore(); return; }
  if(state==="board"){ drawBoard(); ctx.restore(); return; }

  // gameplay world
  drawWorld();

  if(state==="levelclear"){ checkAdvance(1/60); banner("LEVEL "+level+" CLEAR", "GET READY…"); }
  if(state==="gameover"){ overlayBox("GAME OVER","Score "+score+"   ·   "+(keysHint())); }
  if(state==="win"){ overlayBox("YOU WIN!","Score "+score+"   ·   "+(keysHint())); }
  if(state==="enterName"){ drawNameEntry(); }

  drawHUD();
  ctx.restore();
}

function drawWorld(){
  // powerups
  for(const p of powerups) drawPower(p);
  // enemies
  for(const e of enemies) drawSprite(e.spr,e.x,e.y,e.w,e.h,e.hitFlash>0);
  if(boss) drawBoss();
  // bullets
  for(const b of pbullets){ glowRect(b.x,b.y,b.big?b.r*2:3,b.big?b.r*2:9,b.col); }
  for(const b of ebullets){ glowDot(b.x,b.y,b.r,b.col); }
  // player
  drawPlayer();
  // particles
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life*1.6); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.r,p.r); }
  ctx.globalAlpha=1;
  if(flashTimer>0){ ctx.fillStyle="rgba(255,255,255,"+(flashTimer*1.4)+")"; ctx.fillRect(-20,-20,CW+40,CH+40); }
}

function drawSprite(spr,x,y,w,h,flash){
  if(!spr){ ctx.fillStyle="#0ff"; ctx.fillRect(x-w/2,y-h/2,w,h); return; }
  ctx.drawImage(spr,x-w/2,y-h/2,w,h);
  if(flash){ ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=.6; ctx.drawImage(spr,x-w/2,y-h/2,w,h); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; }
}
function drawPlayer(){
  if(player.inv>0 && (Math.floor(player.inv*16)%2===0)) {} // blink
  else {
    const spr=SPR[manifest.ships[weapon]]; const ar=spr.width/spr.height; const h=player.h, w=h*ar;
    ctx.drawImage(spr,player.x-w/2,player.y-h/2,w,h);
    if(shield>0){
      const sl=SPR[manifest.shieldL], sr=SPR[manifest.shieldR];
      const sh=h*1.25, sw=sl.width/sl.height*sh;
      ctx.globalAlpha=.55+0.2*Math.sin(performance.now()/120);
      ctx.drawImage(sl,player.x-w/2-sw*0.7,player.y-sh/2,sw,sh);
      ctx.drawImage(sr,player.x+w/2-sw*0.3,player.y-sh/2,sw,sh);
      ctx.globalAlpha=1;
    }
  }
}
function drawBoss(){
  drawSprite(boss.spr,boss.x,boss.y,boss.w,boss.h,boss.hitFlash>0);
  // hp bar
  const w=boss.w*0.9, x=boss.x-w/2, y=boss.y-boss.h/2-10;
  ctx.fillStyle="#330"; ctx.fillRect(x,y,w,5);
  ctx.fillStyle="#ff3df0"; ctx.fillRect(x,y,w*Math.max(0,boss.hp/boss.maxhp),5);
}
function drawPower(p){
  const col={weapon:"#5dff7a",shield:"#37c6ff",score:"#ffd24a",life:"#ff5a7a"}[p.kind];
  const ch={weapon:"W",shield:"S",score:"$",life:"+"}[p.kind];
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.globalAlpha=.85; ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle="#02040a"; ctx.font="bold 11px 'Press Start 2P',monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(ch,0,1);
  ctx.restore();
}
function glowRect(x,y,w,h,col){ ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8; ctx.fillRect(x-w/2,y-h/2,w,h); ctx.shadowBlur=0; }
function glowDot(x,y,r,col){ ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.shadowBlur=0; }

/* ---------- HUD + UI text ---------- */
function txt(s,x,y,size,col,align){ ctx.fillStyle=col||"#9fe6ff"; ctx.font=(size||10)+"px 'Press Start 2P',monospace"; ctx.textAlign=align||"left"; ctx.textBaseline="alphabetic"; ctx.fillText(s,x,y); }
function drawHUD(){
  txt("SCORE "+String(score).padStart(6,"0"),8,16,9,"#9fe6ff");
  txt("LV "+level,CW/2-18,16,9,"#ffb12e");
  // lives
  for(let i=0;i<lives;i++){ ctx.fillStyle="#5dff7a"; ctx.fillRect(CW-12-(i*14),9,9,7); }
  // weapon + shield
  const wn=["BASE","BIG GUNS","MISSILES","GUNS+MSL","NUKE"][weapon];
  txt(wn,8,CH-7,8,"#37c6ff");
  if(shield>0) txt("SHIELD "+shield,CW-110,CH-7,8,"#37c6ff");
}
function keysHint(){ return "PRESS SPACE / CLICK"; }

function banner(a,b){
  ctx.fillStyle="rgba(2,4,10,.55)"; ctx.fillRect(0,CH/2-44,CW,88);
  txt(a,CW/2,CH/2-6,18,"#5dff7a","center");
  txt(b,CW/2,CH/2+22,9,"#9fe6ff","center");
}
function overlayBox(a,b){
  ctx.fillStyle="rgba(2,4,10,.7)"; ctx.fillRect(0,0,CW,CH);
  txt(a,CW/2,CH/2-20,22,a==="YOU WIN!"?"#ffd24a":"#ff5a7a","center");
  txt(b,CW/2,CH/2+16,9,"#9fe6ff","center");
}
function drawMenu(){
  txt("SULU",CW/2,90,40,"#37c6ff","center");
  txt("INVADERS",CW/2,135,28,"#ffb12e","center");
  txt("ARROWS / A D  or  MOUSE  to move",CW/2,205,9,"#9fe6ff","center");
  txt("SPACE / CLICK  to fire",CW/2,228,9,"#9fe6ff","center");
  txt("collect  W power  S shield  + life",CW/2,256,8,"#5dff7a","center");
  txt(blink()?"PRESS SPACE OR CLICK TO START":" ",CW/2,320,11,"#fff","center");
  txt("6 LEVELS  ·  BEAT THE BOSS",CW/2,360,8,"#ffb12e","center");
  // mini board peek
  const b=getBoard();
  if(b.length){ txt("BEST  "+b[0].name+"  "+b[0].score,CW/2,398,8,"#9fe6ff","center"); }
}
function drawBoard(){
  txt("LEADERBOARD",CW/2,52,20,"#ffb12e","center");
  const b=getBoard();
  if(!b.length) txt("NO SCORES YET",CW/2,150,10,"#9fe6ff","center");
  b.forEach((e,i)=>{ const y=92+i*30; txt((i+1)+".",70,y,10,"#37c6ff"); txt(e.name.slice(0,10),110,y,10,"#fff"); txt(String(e.score).padStart(6,"0"),CW-150,y,10,"#5dff7a"); txt("LV"+(e.level||1),CW-70,y,9,"#ffb12e"); });
  txt(blink()?"PRESS SPACE / CLICK":" ",CW/2,CH-20,9,"#fff","center");
}
function drawNameEntry(){
  ctx.fillStyle="rgba(2,4,10,.82)"; ctx.fillRect(0,0,CW,CH);
  txt("NEW SCORE: "+score,CW/2,CH/2-60,14,"#ffd24a","center");
  txt("ENTER NAME",CW/2,CH/2-24,10,"#9fe6ff","center");
  txt((nameBuf||"")+(blink()?"_":" "),CW/2,CH/2+18,18,"#fff","center");
  txt("TYPE  ·  ENTER TO SAVE",CW/2,CH/2+56,8,"#37c6ff","center");
}
function blink(){ return Math.floor(performance.now()/450)%2===0; }

/* ---------- fullscreen + buttons ---------- */
const fswrap=document.getElementById("fswrap");
const btnFull=document.getElementById("btn-full");
btnFull.addEventListener("click",()=>{ if(document.fullscreenElement) document.exitFullscreen(); else (fswrap.requestFullscreen||fswrap.webkitRequestFullscreen).call(fswrap); });
document.addEventListener("fullscreenchange",()=>{ btnFull.textContent=document.fullscreenElement?"Leave Full Screen":"Go Full Screen"; });
document.querySelectorAll("[data-track]").forEach(btn=>{
  btn.addEventListener("click",()=>setMusicTrack(btn.dataset.track,state==="playing"));
});
document.getElementById("music-vol").addEventListener("input",e=>{
  musicVol=Number(e.target.value)/100;
  music.volume=musicVol;
  music.muted=muted||musicVol<=0;
  if(state==="playing"&&musicVol>0&&!muted) startMusic();
});
document.getElementById("sfx-vol").addEventListener("input",e=>{ sfxVol=Number(e.target.value)/100; });
document.getElementById("btn-mute").addEventListener("click",function(){
  muted=!muted;
  music.muted=muted||musicVol<=0;
  this.textContent="Mute: "+(muted?"On":"Off");
  if(!muted&&state==="playing") startMusic();
});
document.getElementById("btn-restart").addEventListener("click",()=>{ state="menu"; stopMusic(); });
updateSkoolButtons();

/* ---------- boot ---------- */
document.getElementById("loading").textContent="LOADING…";
load().then(()=>{
  document.getElementById("loading").style.display="none";
  makeStars();
  state="menu";
  requestAnimationFrame(frame);
  if(/debug/.test(location.search)){
    window.SULU={ newGame, update, applyPower, spawnBoss,
      get state(){return state}, set state(v){state=v},
      get score(){return score}, get level(){return level}, set level(v){level=v},
      get lives(){return lives}, get weapon(){return weapon}, set weapon(v){weapon=v},
      get enemies(){return enemies}, get boss(){return boss}, get pbullets(){return pbullets}, get ebullets(){return ebullets}, get powerups(){return powerups},
      get player(){return player}, setKey:(k,v)=>{keys[k]=v;}, render,
      step(n){ n=n||1; for(let i=0;i<n;i++) update(0.016); } };
  }
});
})();
</script>
