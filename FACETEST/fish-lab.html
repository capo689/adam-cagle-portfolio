  <style>
    :root { color-scheme: dark; --gold: #e6bd66; --cyan: #55f4df; --ink: #03040a; }

    .lab-id { position: fixed; z-index: 12; top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); padding: 12px 14px; border: 1px solid rgba(85,244,223,.22); border-radius: 14px; background: rgba(3,4,10,.78); box-shadow: 0 16px 60px rgba(0,0,0,.45); backdrop-filter: blur(16px); }

    .ptt { position: relative; isolation: isolate; width: 100%; min-height: 78px; padding: 16px 28px; overflow: hidden; border: 1px solid rgba(230,189,102,.58); border-radius: 14px; color: #f7d98e; background: linear-gradient(135deg, rgba(230,189,102,.13), rgba(230,189,102,.035)); box-shadow: 0 8px 28px rgba(0,0,0,.32), 0 0 26px rgba(230,189,102,.06) inset; cursor: pointer; touch-action: none; font: 600 12px/1.2 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; transition: transform .12s ease, border-color .2s ease, color .2s ease, background .2s ease; }
    .ptt::before { content: ""; position: absolute; z-index: -1; inset: 50% auto auto 50%; width: 24px; height: 24px; border: 1px solid currentColor; border-radius: 50%; opacity: 0; transform: translate(-50%,-50%) scale(.5); }
    .ptt:hover { border-color: rgba(230,189,102,.86); color: #ffe9ad; }
    .ptt:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .ptt[data-state="recording"] { transform: translateY(2px) scale(.992); border-color: rgba(85,244,223,.92); color: #eafffb; background: linear-gradient(135deg, rgba(30,199,180,.28), rgba(12,73,82,.22)); box-shadow: 0 0 38px rgba(85,244,223,.18); }
    .ptt[data-state="recording"]::before { opacity: .65; animation: sonar 1s ease-out infinite; }
    .ptt[data-state="thinking"] { color: rgba(230,189,102,.82); background: rgba(230,189,102,.08); }
    .ptt[data-state="speaking"] { border-color: rgba(123,150,255,.64); color: #dce4ff; background: rgba(53,65,130,.18); }
    .ptt[data-state="exhausted"] { border-color: rgba(255,126,96,.72); color: #ffd3c8; background: rgba(125,36,30,.24); }
    .ptt:disabled { cursor: wait; }
    .state-icon { display: none; width: 38px; height: 38px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .state-icon [data-mode] { display: none; }
    .ptt[data-state="idle"] [data-mode="idle"], .ptt[data-state="recording"] [data-mode="recording"], .ptt[data-state="thinking"] [data-mode="thinking"], .ptt[data-state="speaking"] [data-mode="speaking"], .ptt[data-state="exhausted"] [data-mode="exhausted"] { display: block; }

    .hint kbd { color: rgba(85,244,223,.72); font: inherit; }
    .intro { position: fixed; z-index: 9; top: max(18px, env(safe-area-inset-top)); left: 50%; width: min(560px, calc(100vw - 390px)); margin: 0; transform: translateX(-50%); color: rgba(255,255,255,.38); font-size: 8px; line-height: 1.55; letter-spacing: .1em; text-align: center; text-transform: uppercase; text-shadow: 0 2px 18px #000; transition: opacity .8s ease; }
    body[data-engaged="true"] .intro { opacity: 0; }
    .transcript { position: fixed; z-index: 8; right: max(22px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 132px); width: min(440px, calc(100vw - 34px)); text-align: right; pointer-events: none; }
    .transcript[hidden] { display: none; }
    .transcript p { margin: 5px 0; text-shadow: 0 2px 20px #000; }
    .transcript .user { color: rgba(255,255,255,.52); font-size: 9px; }
    .transcript .agent { color: rgba(230,189,102,.86); font-size: 10px; }
    @keyframes sonar { to { opacity: 0; transform: translate(-50%,-50%) scale(4.2); } }
    @media (max-width: 760px) { .intro { display: none; } }
    @media (max-width: 600px) {
      .lab-id { top: 10px; left: 10px; padding: 9px 11px; }
      .lab-id span { display: none; }
      .dock { right: 12px; bottom: 12px; width: 96px; padding: 7px; border-radius: 27px; }
      .state { position: absolute; right: 0; bottom: calc(100% + 8px); width: max-content; padding: 7px 11px; border: 1px solid rgba(230,189,102,.18); border-radius: 12px; background: rgba(3,4,10,.82); white-space: nowrap; }
      .ptt { display: grid; place-items: center; width: 80px; min-height: 80px; height: 80px; padding: 0; border-radius: 50%; }
      .button-copy { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .state-icon { display: block; }
      .hint { display: none; }
      .transcript { right: 14px; bottom: 138px; width: min(300px, calc(100vw - 28px)); }
    }
